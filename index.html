<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Taste of Satara</title>
<meta name="description" content="साताऱ्याचा घरगुती दिवाळी फराळ — Online Order करा">
<meta name="theme-color" content="#8B1A1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taste of Satara">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --maroon:#8B1A1A; --maroon-d:#6B1010; --maroon-l:#B94040;
  --gold:#C8932A; --gold-l:#F0C96A;
  --cream:#FDF6EE; --warm:#FFF9F3;
  --text:#1A0A00; --text2:#5C3018; --text3:#9C7050;
  --border:#E8CCAA; --white:#FFFFFF;
  --green:#2E7D32; --green-bg:#E8F5E9;
  --red:#C62828; --red-bg:#FFEBEE;
  --blue:#1565C0; --blue-bg:#E3F2FD;
  --r:14px; --r-sm:8px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100vh; background:var(--cream); font-family:'DM Sans',sans-serif; color:var(--text); }
.mr { font-family:'Tiro Devanagari Marathi',serif; }

/* Header & Brand */
.header { background:var(--maroon); position:sticky; top:0; z-index:100; }
.header-inner { display:flex; align-items:center; gap:14px; padding:14px 16px; }
.logo-circle { width:62px; height:62px; border-radius:50%; background:var(--white); border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; cursor:pointer; }
.logo-circle img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.brand { color:#fff; flex:1; }
.brand-name { font-family:'Tiro Devanagari Marathi',serif; font-size:20px; line-height:1.2; }
.brand-sub { font-size:12px; opacity:.75; margin-top:2px; }
.admin-badge { background:var(--gold); color:var(--maroon-d); font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.5px; margin-left:4px; }
.settings-btn, .refresh-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px; }
.refresh-btn svg { width:13px; height:13px; transition:transform .5s; }
.refresh-btn.spinning svg { animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Order Type Tabs */
.ot-wrap { background:var(--maroon-d); overflow-x:auto; scrollbar-width:none; display:flex; padding:0 10px; }
.ot-wrap::-webkit-scrollbar { display:none; }
.ot-tab { flex-shrink:0; padding:9px 13px; font-size:12px; font-weight:500; color:rgba(255,255,255,.6); border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; cursor:pointer; white-space:nowrap; transition:all .15s; text-align:center; line-height:1.3; }
.ot-tab.active { color:var(--gold-l); border-bottom-color:var(--gold-l); }

/* Body */
.body { padding:14px; padding-bottom:110px; }

/* Combo Cards */
.combo-card { background:var(--white); border:1.5px solid var(--gold-l); border-radius:var(--r); padding:14px; margin-bottom:14px; }
.combo-top { display:flex; align-items:flex-start; gap:10px; }
.combo-emoji { font-size:28px; flex-shrink:0; }
.combo-title { font-size:15px; font-family:'Tiro Devanagari Marathi',serif; margin-bottom:2px; }
.combo-sub { font-size:12px; color:var(--text3); line-height:1.5; }
.combo-price { font-size:21px; font-weight:700; color:var(--maroon); margin-top:5px; }
.combo-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.chip { background:var(--cream); color:var(--text2); font-size:11px; padding:5px 10px; border-radius:10px; border:1px solid var(--border); line-height:1.4; text-align:center; }

/* Grid Items */
.sec-hd { font-size:13px; font-weight:600; color:var(--text2); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.sel-badge { background:var(--maroon); color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
.items-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
@media(min-width:480px) { .items-grid { grid-template-columns:repeat(3,1fr); } }
.items-grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
@media(max-width:600px) { .items-grid-5 { grid-template-columns:repeat(3,1fr); } }
@media(max-width:380px) { .items-grid-5 { grid-template-columns:repeat(2,1fr); } }

.item-card { background:var(--white); border:1.5px solid var(--border); border-radius:var(--r); overflow:hidden; transition:border-color .15s,transform .15s; cursor:pointer; }
.item-card.selected { border-color:var(--maroon); }
.item-card:active { transform:scale(.97); }
.item-img { background:linear-gradient(135deg,#FFE8CC,#FFD0A0); height:70px; display:flex; align-items:center; justify-content:center; font-size:34px; position:relative; }
.sel-check { position:absolute; top:5px; right:5px; width:19px; height:19px; border-radius:50%; background:var(--maroon); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
.item-card.selected .sel-check { opacity:1; }
.item-body { padding:8px 9px; }
.item-en { font-size:12px; font-weight:600; line-height:1.3; }
.item-mr { font-size:11px; color:var(--text3); font-family:'Tiro Devanagari Marathi',serif; }
.item-price { font-size:12px; color:var(--maroon); font-weight:600; margin-top:2px; }
.item-foot { padding:0 8px 8px; }

/* Selector Elements */
.wt-row { display:flex; gap:4px; }
.wbtn { flex:1; padding:5px 2px; text-align:center; border-radius:6px; border:1.5px solid var(--border); background:var(--warm); color:var(--text2); font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; }
.wbtn.sel { background:var(--maroon); color:#fff; border-color:var(--maroon); }
.qty-row { display:flex; align-items:center; gap:6px; justify-content:center; margin-top:6px; }
.qbtn { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--maroon); background:#fff; color:var(--maroon); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.qbtn:active { background:var(--maroon); color:#fff; }
.qnum { font-size:14px; font-weight:700; min-width:18px; text-align:center; }
.item-subtotal { font-size:11px; color:var(--maroon); text-align:center; margin-top:3px; font-weight:600; }
.add-btn { width:100%; padding:7px; background:var(--maroon); color:#fff; border:none; border-radius:var(--r-sm); font-size:12px; font-weight:600; cursor:pointer; }
.pick-bar { background:var(--white); border:1.5px solid var(--border); border-radius:var(--r); padding:11px 13px; margin-bottom:13px; display:flex; align-items:center; gap:10px; }
.pick-prog { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.pick-fill { height:100%; background:var(--maroon); border-radius:3px; transition:width .3s; }
.pick-lbl { font-size:13px; font-weight:600; min-width:36px; text-align:right; }

/* Cart and Overlay */
.cart-bar { position:fixed; bottom:0; left:0; right:0; background:var(--white); border-top:1px solid var(--border); padding:11px 15px; z-index:100; box-shadow:0 -4px 20px rgba(139,26,26,.1); }
.cart-bar-inner { display:flex; align-items:center; gap:10px; max-width:600px; margin:auto; }
.cart-info { flex:1; }
.cart-items-txt { font-size:12px; color:var(--text3); }
.cart-total-txt { font-size:17px; font-weight:700; color:var(--maroon); }
.place-btn { background:var(--maroon); color:#fff; border:none; border-radius:var(--r-sm); padding:12px 20px; font-size:15px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; transition:background .15s; white-space:nowrap; }
.place-btn:active { background:var(--maroon-d); }
.place-btn:disabled { background:#ccc; cursor:not-allowed; }

.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s; }
.overlay.open { opacity:1; pointer-events:all; }
.modal { background:#fff; width:100%; max-height:92vh; border-radius:20px 20px 0 0; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.34,1.56,.64,1); padding-bottom:30px; }
.overlay.open .modal { transform:translateY(0); }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:12px auto 0; }
.modal-hdr { padding:13px 17px 11px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-hdr h2 { font-size:17px; font-family:'Tiro Devanagari Marathi',serif; }
.xbtn { width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--warm); cursor:pointer; font-size:17px; color:var(--text2); display:flex; align-items:center; justify-content:center; }
.modal-section { padding:14px 17px; }

/* Forms & UI Misc */
.form-section { padding:0 17px; }
.field { margin-bottom:12px; }
.field label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text2); display:block; margin-bottom:5px; }
.field label .mr-lbl { font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text3); font-family:'Tiro Devanagari Marathi',serif; }
.field input, .field textarea, .field select { width:100%; padding:11px 13px; font-family:'DM Sans',sans-serif; font-size:15px; color:var(--text); background:var(--warm); border:1.5px solid var(--border); border-radius:var(--r-sm); outline:none; transition:border .2s; -webkit-appearance:none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--maroon); background:#fff; }
.field textarea { resize:none; height:68px; line-height:1.5; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.req { color:var(--maroon); }

.summary-block, .order-summary { margin:12px 17px 14px; background:var(--cream); border-radius:var(--r-sm); padding:11px 13px; border:1px solid var(--border); }
.sum-row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
.sum-row.total, .sum-row.total-row { font-size:16px; font-weight:700; color:var(--maroon); border-top:1px dashed var(--border); margin-top:6px; padding-top:8px; }
.confirm-btn { display:block; width:calc(100% - 34px); margin:0 17px; background:var(--maroon); color:#fff; border:none; border-radius:var(--r-sm); padding:14px; font-size:16px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; text-align:center; }
.del-order-btn { display:block; width:calc(100% - 34px); margin:0 17px 4px; background:#FFEBEE; color:#C62828; border:1.5px solid #C62828; border-radius:var(--r-sm); padding:11px; font-size:14px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; text-align:center; }

.success-screen { text-align:center; padding:36px 22px; }
.success-icon { font-size:60px; margin-bottom:14px; }
.success-screen h2 { font-size:21px; font-family:'Tiro Devanagari Marathi',serif; margin-bottom:8px; }
.success-screen p { font-size:14px; color:var(--text3); line-height:1.6; }
.order-id { background:var(--maroon); color:#fff; border-radius:var(--r); padding:11px 22px; margin:14px auto; display:inline-block; font-size:18px; font-weight:700; letter-spacing:1.5px; }
.sync-msg { font-size:12px; margin-top:8px; padding:7px 14px; border-radius:20px; display:inline-block; }
.sync-msg.syncing { background:#E3F2FD; color:#1565C0; }
.sync-msg.ok { background:var(--green-bg); color:var(--green); }
.sync-msg.fail { background:#FFEBEE; color:#C62828; }
.new-order-btn { display:inline-block; margin-top:16px; padding:12px 26px; background:var(--maroon); color:#fff; border:none; border-radius:var(--r-sm); font-size:15px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; }

/* Admin & Status elements */
.tab-bar { background:var(--maroon-d); display:flex; padding:0 6px; overflow-x:auto; scrollbar-width:none; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { flex-shrink:0; padding:10px 16px; font-size:13px; font-weight:500; color:rgba(255,255,255,.6); border:none; border-bottom:2px solid transparent; background:none; cursor:pointer; white-space:nowrap; font-family:'DM Sans',sans-serif; transition:all .15s; }
.tab-btn.active { color:var(--gold-l); border-bottom-color:var(--gold-l); }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:10px 10px 0; }
@media(max-width:600px) { .stats-row { grid-template-columns:repeat(2,1fr); gap:7px; padding:8px 8px 0; } }
.stat-card { background:var(--white); border:1.5px solid var(--border); border-radius:var(--r); padding:10px 11px; }
.stat-label { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text3); margin-bottom:3px; }
.stat-value { font-size:1.25rem; font-weight:700; color:var(--maroon); }
.stat-sub { font-size:9px; color:var(--text3); margin-top:2px; }

/* Admin Toolbar & Table */
.toolbar { display:flex; align-items:center; gap:6px; padding:8px 10px; flex-wrap:wrap; }
.search-wrap { flex:1; min-width:140px; position:relative; }
.search-wrap svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text3); }
.search-wrap input { width:100%; padding:8px 10px 8px 28px; background:var(--white); border:1.5px solid var(--border); border-radius:var(--r-sm); font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text); outline:none; }
.filter-select { padding:8px 8px; background:var(--white); border:1.5px solid var(--border); border-radius:var(--r-sm); font-family:'DM Sans',sans-serif; font-size:12px; color:var(--text2); outline:none; cursor:pointer; max-width:130px; }
.table-wrap { margin:0 8px 100px; background:var(--white); border:1.5px solid var(--border); border-radius:var(--r); overflow:hidden; }
.table-count { font-size:11px; color:var(--text3); padding:8px 10px 0; font-weight:500; }
.table-scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead { background:var(--cream); }
th { padding:8px 8px; text-align:left; font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text2); white-space:nowrap; border-bottom:1.5px solid var(--border); }
td { padding:9px 8px; font-size:11px; border-top:1px solid var(--border); vertical-align:middle; }
tr:hover td { background:#FFF5EC; }
.rc-action-btn { background:none; border:1.5px solid var(--border); border-radius:6px; padding:5px 7px; font-size:11px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; color:var(--text2); transition:all .15s; margin-left:3px; }
.rc-action-btn:hover { background:var(--maroon); color:#fff; border-color:var(--maroon); }

/* Badges & Icons */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:600; white-space:nowrap; }
.badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
.badge-confirmed { background:#FFF8E1; color:#F57F17; }
.badge-prepared { background:var(--blue-bg); color:var(--blue); }
.badge-packed { background:#EDE7F6; color:#6A1B9A; }
.badge-ready-to-deliver { background:#FFF3E0; color:#E65100; }
.badge-delivered { background:var(--green-bg); color:var(--green); }
.badge-cancelled { background:var(--red-bg); color:var(--red); }
.badge-pending { background:#FFF8E1; color:#F57F17; }
.badge-received { background:var(--green-bg); color:var(--green); }
.order-id { font-family:monospace; font-size:11px; color:var(--maroon); font-weight:600; }
.cust-name { font-weight:600; font-size:12px; }
.cust-phone { font-size:10px; color:var(--text3); }
.amt { font-weight:700; color:var(--maroon); }
.date-cell { font-size:11px; color:var(--text3); }
.pay-mode { font-size:11px; color:var(--text2); }

/* Status Modal Additions */
.item-status-card { background:var(--warm); border:1.5px solid var(--border); border-radius:var(--r-sm); padding:11px 13px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.item-status-card.updated { border-color:var(--green); background:var(--green-bg); }
.isc-emoji { font-size:22px; flex-shrink:0; width:32px; text-align:center; }
.isc-info { flex:1; }
.isc-name { font-size:13px; font-weight:600; color:var(--text); }
.isc-sub { font-size:10px; color:var(--text3); margin-top:2px; }
.isc-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.isc-select { padding:6px 10px; background:var(--white); border:1.5px solid var(--border); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; color:var(--text); outline:none; cursor:pointer; min-width:150px; -webkit-appearance:none; }
.isc-btn { background:var(--maroon); color:#fff; border:none; border-radius:6px; padding:5px 12px; font-size:11px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; white-space:nowrap; transition:background .15s; }
.isc-btn.done { background:var(--green); }
.isc-edit-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
.isc-edit-row label { font-size:10px; color:var(--text3); white-space:nowrap; }
.isc-edit-row input { width:60px; padding:4px 7px; font-size:12px; font-family:'DM Sans',sans-serif; border:1.5px solid var(--border); border-radius:6px; background:var(--white); color:var(--text); outline:none; text-align:center; }
.divider { height:1px; background:var(--border); margin:16px 0; }
.pay-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text2); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.pay-section-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* Global Misc */
body.mode-customer .toast { bottom:90px; }
body.mode-admin .toast { bottom:16px; }
.toast { position:fixed; left:50%; transform:translateX(-50%) translateY(80px); background:var(--text); color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; font-weight:500; z-index:999; transition:transform .25s; white-space:nowrap; max-width:90vw; text-align:center; }
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body class="mode-customer">

<!-- PWA Banner -->
<div id="pwa-banner" style="display:none;background:linear-gradient(135deg,#8B1A1A,#5C1010);padding:10px 14px;align-items:center;gap:10px;z-index:150;">
  <div style="font-size:36px;border-radius:50%;border:2px solid #C8932A;flex-shrink:0;">🪔</div>
  <div style="flex:1;">
    <div style="font-size:13px;font-weight:700;color:#fff;">📱 App Install करा!</div>
    <div style="font-size:11px;color:rgba(255,255,255,.7);">Home Screen वर ठेवा</div>
  </div>
  <button id="pwa-install-btn" style="background:#C8932A;color:#3D1A00;border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;">⬇ Install</button>
  <button onclick="document.getElementById('pwa-banner').style.display='none';" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;flex-shrink:0;">✕</button>
</div>

<!-- Customer Header -->
<div id="cust-header">
<div class="header">
  <div class="header-inner">
    <div class="logo-circle" id="logoBtn">
      <span style="font-size:34px;">🪔</span>
    </div>
    <div class="brand">
      <div class="brand-name">Taste of Satara</div>
      <div class="brand-sub">साताऱ्याचा घरगुती दिवाळी फराळ 🪔</div>
    </div>
    <button class="settings-btn" onclick="showPWAInstructions()">📱 Install</button>
  </div>
  <div class="ot-wrap" id="ot-bar"></div>
</div>
<div id="rate-bar" style="background:#FFF8EE;color:#9C7050;font-size:11px;text-align:center;padding:5px;border-bottom:1px solid #E8CCAA;">⏳ Google Sheet वरून मेनू लोड होत आहे...</div>
</div>

<div id="view-customer">
  <div class="body" id="body-area"></div>
  <div class="cart-bar" id="cart-bar" style="display:none;">
    <div class="cart-bar-inner">
      <div class="cart-info">
        <div class="cart-items-txt" id="cart-items-txt"></div>
        <div class="cart-total-txt" id="cart-total-txt"></div>
      </div>
      <button class="place-btn" onclick="openReview()">ऑर्डर द्या →</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="overlayBg(event)" style="display:none;">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-hdr">
      <h2 id="modal-title">ऑर्डर तपासा</h2>
      <button class="xbtn" onclick="closeOverlay()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  SHARED CONFIG 
// ══════════════════════════════════════════
const CFG = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch{ return d; } },
  set(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
};

const HARDCODED_URL = 'https://script.google.com/macros/s/AKfycbxUXlyqoHFuqOXV4i_6tClXc1rT6DRqHRZqRnZzDJohipkx9qiHg0GS4gZRH2bI_A/exec';
const ADMIN_PHONE   = '';  

let SCRIPT_URL = CFG.get('tos_script_url','') || HARDCODED_URL;

function closeOverlay(){ const ov=document.getElementById('overlay'); ov.classList.remove('open'); setTimeout(()=>{ov.style.display='none';},300); }
function overlayBg(e){ if(e.target===document.getElementById('overlay')) closeOverlay(); }
let _t;
function toast(msg,dur){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_t); _t=setTimeout(()=>el.classList.remove('show'),dur||3000);
}

// ══════════════════════════════════════════
//  MENU & LIVE RATES (DYNAMIC EMJOS/IMAGES)
// ══════════════════════════════════════════
const ITEMS = []; // Will be dynamically populated
const ITEM_IMGS = {}; // Will hold URLs if provided in Column L

let ratesSource = 'fallback';

async function fetchLiveRates(){
  if(!SCRIPT_URL) return;
  try {
    const resp = await fetch(SCRIPT_URL + '?action=get_rates');
    const text = await resp.text();
    const data = JSON.parse(text);
    
    if(data.status === 'ok'){
      const dictionary = {
        'BESAN LADU': { id: 1, mr: 'बेसन लाडू', emoji: '🟡' },
        'KALICHE LADU': { id: 2, mr: 'कळीचे लाडू', emoji: '🟤' },
        'BHAJANI CHAKALI': { id: 3, mr: 'भाजणी चकली', emoji: '🌀' },
        'KHARI SHANKARPALI': { id: 4, mr: 'खारी शंकरपाळी', emoji: '⭐' },
        'GOD SHANKARPALI': { id: 5, mr: 'गोड शंकरपाळी', emoji: '🌟' },
        'PATAL POHE CHIVDA': { id: 6, mr: 'पातळ पोहे चिवडा', emoji: '🟠' },
        'DAGADI POHE CHIVDA': { id: 7, mr: 'दगडी पोहे चिवडा', emoji: '🔶' },
        'ANARASE': { id: 8, mr: 'अनारसे', emoji: '🫓' },
        'KARANJI': { id: 9, mr: 'करंजी', emoji: '🥟' },
        'BUTTER CHAKALI': { id: 10, mr: 'बटर चकली', emoji: '🔵' },
        'SHEV': { id: 11, mr: 'शेव', emoji: '🍝' },
        'DINK LADU': { id: 12, mr: 'डिंक लाडू', emoji: '🟫' },
        'METHI LADU': { id: 13, mr: 'मेथी लाडू', emoji: '🌿' },
        'NANKHATAI': { id: 14, mr: 'नानखटाई', emoji: '🍪' }
      };

      ITEMS.length = 0; 
      let newIdCounter = 100; 
      
      const ratesSourceObj = data.rateDetails || data.rates;

      Object.entries(ratesSourceObj).forEach(([name, val]) => {
        let price = typeof val === 'object' ? val.price : val;
        let sheetEmoji = (data.emojis && data.emojis[name]) ? data.emojis[name] : (typeof val === 'object' ? val.emoji : null);
        
        if(price > 0) {
          const info = dictionary[name] || { id: newIdCounter++, mr: name, emoji: '🍱' }; 
          
          let finalEmoji = info.emoji;
          if (sheetEmoji) {
            if (sheetEmoji.startsWith('http')) {
              ITEM_IMGS[info.id] = sheetEmoji;
            } else {
              finalEmoji = sheetEmoji;
            }
          }

          ITEMS.push({ id: info.id, en: name, mr: info.mr, emoji: finalEmoji, price: price });
        }
      });

      if(data.comboRates){
        Object.entries(data.comboRates).forEach(([name, price]) => {
          if(COMBOS[name] && price > 0) COMBOS[name].price = price;
        });
      }
      
      ratesSource = 'live';
      renderBody(); 
      
      const bar = document.getElementById('rate-bar');
      if(bar){ bar.textContent = '✅ मेनू Google Sheet वरून सिंक झाला'; bar.style.color='var(--green)'; setTimeout(()=>bar.remove(),3000); }
    }
  } catch(e){
    console.log('Rate fetch failed:', e.message);
  }
}

const ORDER_TYPES = [
  {key:'MINI COMBO',         label:'Mini Combo',       mr:'मिनी कॉम्बो'},
  {key:'MEDIUM COMBO',       label:'Medium Combo',     mr:'मीडियम कॉम्बो'},
  {key:'BEST SELLING COMBO', label:'Best Selling',     mr:'बेस्ट सेलिंग'},
  {key:'MY CHOICE COMBO',    label:'My Choice',        mr:'माझी निवड'},
  {key:'FARAL',              label:'Custom Faral',     mr:'कस्टम फराळ'},
];

const COMBOS = {
  'MINI COMBO':        {price:699, weight:250, itemIds:[1,5,3,9,6]},
  'MEDIUM COMBO':      {price:949, weight:250, itemIds:[2,5,11,1,9,3,6]},
  'BEST SELLING COMBO':{price:1899,weight:500, itemIds:[2,5,11,1,9,3,6]},
  'MY CHOICE COMBO':   {price:799, weight:250, pickCount:5},
  'FARAL':             {price:null},
};
const WEIGHTS = [250,500,1000];

let activeType = 'MINI COMBO';
let cart = {type:'MINI COMBO', items:[], selectedIds:[], comboPrice:null};
let orders = CFG.get('tos_orders',[]);

function fmt(n){ return '₹' + Math.round(n); }
function priceForWeight(item,w){ return (item.price/1000)*w; }
function genUUID(){ return Math.random().toString(16).slice(2,10); }

function updateCartBar(){
  const n=cart.items.reduce((s,x)=>s+x.qty,0);
  const bar=document.getElementById('cart-bar');
  if(n===0){bar.style.display='none';return;}
  bar.style.display='';
  document.getElementById('cart-items-txt').textContent=n+' पदार्थ निवडले';
  document.getElementById('cart-total-txt').textContent=fmt(cart.comboPrice!=null ? cart.comboPrice : cart.items.reduce((s,x)=>s+x.unitPrice*x.qty,0));
}

function renderTabs(){
  document.getElementById('ot-bar').innerHTML=ORDER_TYPES.map(ot=>
    `<button class="ot-tab ${ot.key===activeType?'active':''}" onclick="setType('${ot.key}')">
      ${ot.label}<br><span style="font-size:10px;font-family:'Tiro Devanagari Marathi',serif;">${ot.mr}</span>
    </button>`
  ).join('');
}

function setType(t){
  activeType=t;
  cart={type:t,items:[],selectedIds:[],comboPrice:null};
  renderTabs();renderBody();updateCartBar();
}

function renderBody(){
  const area=document.getElementById('body-area');
  const combo=COMBOS[activeType];

  if(['MINI COMBO','MEDIUM COMBO','BEST SELLING COMBO'].includes(activeType)){
    const its=combo.itemIds.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);
    area.innerHTML=`
      <div class="combo-card">
        <div class="combo-top"><div class="combo-emoji">🎁</div><div>
          <div class="combo-title">${activeType}</div>
          <div class="combo-sub">प्रत्येक पदार्थ ${combo.weight}g · ${its.length} items</div>
          <div class="combo-price">${fmt(combo.price)}</div>
        </div></div>
        <div class="combo-chips">${its.map(i=>`<span class="chip" style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;">${ITEM_IMGS[i.id]?`<img src="${ITEM_IMGS[i.id]}" style="width:28px;height:28px;object-fit:cover;border-radius:50%;flex-shrink:0;">`:`<span style="font-size:18px;">${i.emoji}</span>`}<span><span style="display:block;font-size:11px;font-weight:600;">${i.en}</span></span></span>`).join('')}</div>
      </div>
      <button class="place-btn" style="width:100%;border-radius:var(--r-sm);padding:13px;font-size:15px;" onclick="addFixedCombo()">
        कार्टमध्ये टाका · ${fmt(combo.price)}
      </button>`;
  }
  else if(activeType==='MY CHOICE COMBO'){
    const sel=cart.selectedIds||[];
    const pct=Math.round(sel.length/combo.pickCount*100);
    area.innerHTML=`
      <div class="combo-card">
        <div class="combo-top"><div class="combo-emoji">✨</div><div>
          <div class="combo-title">माझी निवड कॉम्बो</div>
          <div class="combo-sub">कोणतेही <strong>5 पदार्थ</strong> निवडा · प्रत्येक 250g</div>
          <div class="combo-price">${fmt(combo.price)}</div>
        </div></div>
      </div>
      <div class="pick-bar">
        <span style="font-size:13px;color:var(--text2);">निवडले</span>
        <div class="pick-prog"><div class="pick-fill" style="width:${pct}%"></div></div>
        <span class="pick-lbl" style="color:${sel.length===5?'var(--green)':'var(--maroon)'};">${sel.length}/5</span>
      </div>
      <div class="sec-hd">पदार्थ निवडा ${sel.length>0?`<span class="sel-badge">${sel.length} निवडले</span>`:''}</div>
      <div class="items-grid-5">
        ${ITEMS.filter(it=>it.id!==12&&it.id!==13).map(it=>{
          const isSel=sel.includes(it.id);
          const dis=!isSel&&sel.length>=5;
          return`<div class="item-card ${isSel?'selected':''}" onclick="${dis?`toast('5 पदार्थ आधीच निवडले')`:`toggleMyChoice(${it.id})`}" style="${dis?'opacity:.4;cursor:not-allowed;':''}">
            <div class="item-img" style="height:70px;font-size:26px;padding:0;overflow:hidden;">${ITEM_IMGS[it.id]?`<img src="${ITEM_IMGS[it.id]}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:30px;display:flex;align-items:center;justify-content:center;height:100%;">${it.emoji}</span>`}<div class="sel-check">✓</div></div>
            <div class="item-body" style="padding:6px 7px;">
              <div class="item-en" style="font-size:10px;">${it.en}</div>
              <div style="font-size:10px;color:${isSel?'var(--maroon)':'var(--text3)'};margin-top:2px;font-weight:600;">${isSel?'✓ निवडले':'टॅप करा'}</div>
            </div>
          </div>`;}).join('')}
      </div>
      <button class="place-btn" style="width:100%;border-radius:var(--r-sm);padding:13px;font-size:15px;margin-top:4px;" ${sel.length!==5?'disabled':''} onclick="addMyChoice()">
        ${sel.length===5?`कार्टमध्ये टाका · ${fmt(combo.price)}`:`अजून ${5-sel.length} पदार्थ निवडा`}
      </button>`;
  }
  else {
    area.innerHTML=`
      <div class="combo-card">
        <div class="combo-top"><div class="combo-emoji">🛒</div><div>
          <div class="combo-title">कस्टम फराळ</div>
          <div class="combo-sub">पदार्थ निवडा · वजन ठरवा (250/500/1000g) · प्रति किलो दराने</div>
        </div></div>
      </div>
      <div class="sec-hd">पदार्थ व वजन निवडा</div>
      <div class="items-grid">
        ${ITEMS.map(it=>{
          const ci=cart.items.find(x=>x.id===it.id);
          const selW=ci?ci.weight:null;
          return`<div class="item-card ${ci?'selected':''}">
            <div class="item-img" style="padding:0;overflow:hidden;">${ITEM_IMGS[it.id]?`<img src="${ITEM_IMGS[it.id]}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:34px;display:flex;align-items:center;justify-content:center;height:100%;">${it.emoji}</span>`}<div class="sel-check">✓</div></div>
            <div class="item-body">
              <div class="item-en">${it.en}</div>
              <div class="item-price">${fmt(it.price)}/kg</div>
            </div>
            <div class="item-foot">
              <div class="wt-row">
                ${WEIGHTS.map(w=>`<div class="wbtn ${selW===w?'sel':''}" onclick="setFaralWeight(${it.id},${w})">${w}g</div>`).join('')}
              </div>
              ${ci?`<div class="qty-row">
                <button class="qbtn" onclick="faralQty(${it.id},-1)">−</button>
                <span class="qnum">${ci.qty}</span>
                <button class="qbtn" onclick="faralQty(${it.id},1)">+</button>
              </div>
              <div class="item-subtotal">${fmt(priceForWeight(it,ci.weight)*ci.qty)}</div>`:''}
            </div>
          </div>`;}).join('')}
      </div>`;
  }
}

function addFixedCombo(){
  const combo=COMBOS[activeType];
  cart.items=combo.itemIds.map(id=>{
    const it=ITEMS.find(i=>i.id===id);
    if(!it) return null;
    return{id:it.id,en:it.en,emoji:it.emoji,weight:combo.weight,qty:1,unitPrice:priceForWeight(it,combo.weight)};
  }).filter(Boolean);
  cart.comboPrice=combo.price;
  updateCartBar();openReview();
}
function toggleMyChoice(id){
  const idx=cart.selectedIds.indexOf(id);
  if(idx>-1) cart.selectedIds.splice(idx,1);
  else if(cart.selectedIds.length<5) cart.selectedIds.push(id);
  renderBody();updateCartBar();
}
function addMyChoice(){
  const combo=COMBOS['MY CHOICE COMBO'];
  cart.items=cart.selectedIds.map(id=>{
    const it=ITEMS.find(i=>i.id===id);
    return{id:it.id,en:it.en,emoji:it.emoji,weight:250,qty:1,unitPrice:priceForWeight(it,250)};
  });
  cart.comboPrice=combo.price;
  updateCartBar();openReview();
}
function setFaralWeight(id,w){
  const it=ITEMS.find(i=>i.id===id);
  const ex=cart.items.find(x=>x.id===id);
  if(ex){ex.weight=w;ex.unitPrice=priceForWeight(it,w);}
  else cart.items.push({id,en:it.en,emoji:it.emoji,weight:w,qty:1,unitPrice:priceForWeight(it,w)});
  renderBody();updateCartBar();
}
function faralQty(id,d){
  const ci=cart.items.find(x=>x.id===id);
  if(!ci)return;
  ci.qty=Math.max(0,ci.qty+d);
  if(ci.qty===0) cart.items=cart.items.filter(x=>x.id!==id);
  renderBody();updateCartBar();
}

function openReview(){
  if(!cart.items.length){toast('कार्ट रिकामे आहे');return;}
  const total = cart.comboPrice!=null ? cart.comboPrice : cart.items.reduce((s,x)=>s+x.unitPrice*x.qty,0);
  document.getElementById('modal-title').textContent='ऑर्डर तपासा';
  document.getElementById('modal-body').innerHTML=`
    ${cart.items.map(ci=>`
      <div class="cart-row" style="display:flex;align-items:center;gap:10px;padding:10px 17px;border-bottom:1px solid var(--border);">
        <div class="c-emoji" style="width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;">${ITEM_IMGS[ci.id]?`<img src="${ITEM_IMGS[ci.id]}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:24px;display:flex;align-items:center;justify-content:center;height:100%;background:linear-gradient(135deg,#FFE8CC,#FFD0A0);">${ci.emoji}</span>`}</div>
        <div class="c-info" style="flex:1;">
          <div class="c-name" style="font-size:13px;font-weight:600;">${ci.en}</div>
          <div class="c-sub" style="font-size:12px;color:var(--text3);">${ci.weight}g × ${ci.qty}</div>
        </div>
        ${activeType==='FARAL' ? `<div class="c-amt" style="font-size:14px;font-weight:700;color:var(--maroon);">${fmt(ci.unitPrice*ci.qty)}</div>` : `<div class="c-amt" style="font-size:11px;color:var(--text3);font-weight:400;">included</div>`}
      </div>`).join('')}
    <div class="summary-block">
      <div class="sum-row"><span>Order Type</span><span style="font-weight:500;">${activeType}</span></div>
      <div class="sum-row total"><span>एकूण / Total</span><span>${fmt(total)}</span></div>
    </div>
    <div class="form-section">
      <div class="field"><label>नाव / Name <span class="req">*</span></label><input type="text" id="f-name"></div>
      <div class="field"><label>मोबाईल / Phone <span class="req">*</span></label><input type="tel" id="f-phone" maxlength="10"></div>
      <div class="field"><label>डिलिव्हरी ठिकाण / Delivery Location</label><input type="text" id="f-loc"></div>
      <div class="field"><label>संदर्भ / Referred By</label><input type="text" id="f-ref"></div>
      <div class="field"><label>विशेष सूचना / Note</label><textarea id="f-note"></textarea></div>
    </div>
    <button class="confirm-btn" onclick="confirmOrder()">ऑर्डर कन्फर्म करा · ${fmt(total)}</button>`;
  const _ov=document.getElementById('overlay'); _ov.style.display='flex'; requestAnimationFrame(()=>_ov.classList.add('open'));
}

async function confirmOrder(){
  const name=document.getElementById('f-name').value.trim(), phone=document.getElementById('f-phone').value.trim();
  if(!name){toast('कृपया नाव टाका');return;}
  if(!phone||!/^\d{10}$/.test(phone)){toast('10 अंकी मोबाईल नंबर टाका');return;}
  
  const uuid=genUUID(), orderId='TOS-'+uuid;
  const total = cart.comboPrice!=null ? cart.comboPrice : cart.items.reduce((s,x)=>s+x.unitPrice*x.qty,0);
  const order={
    id:orderId, uuid, customer:name, phone,
    deliveryLocation:document.getElementById('f-loc').value.trim(),
    referredBy:document.getElementById('f-ref').value.trim(),
    note:document.getElementById('f-note').value.trim(),
    orderType:activeType, items:[...cart.items], total,
    status:'CONFIRMED', payment:'PENDING', createdAt:Date.now(), synced:false
  };

  orders.unshift(order); CFG.set('tos_orders',orders);
  cart={type:activeType,items:[],selectedIds:[],comboPrice:null};
  updateCartBar(); renderBody();

  const sid='sync-'+uuid;
  document.getElementById('modal-title').textContent='✓ ऑर्डर मिळाली!';
  document.getElementById('modal-body').innerHTML=`
    <div class="success-screen">
      <div class="success-icon">🎉</div>
      <h2>ऑर्डर दिली! धन्यवाद!</h2>
      <div class="order-id">${orderId}</div>
      ${SCRIPT_URL?`<div class="sync-msg syncing" id="${sid}">📊 Google Sheet मध्ये सेव्ह होत आहे...</div>`:''}
      <button class="new-order-btn" onclick="closeOverlay();setType('${activeType}')">नवीन ऑर्डर द्या</button>
    </div>`;

  if(SCRIPT_URL){
    try{
      const rows=order.items.map((ci,i)=>({
        srNo:order.uuid+'-'+(i+1), orderDate:new Date(order.createdAt).toLocaleDateString('en-GB'),
        name:order.customer, phone:order.phone, deliveryLocation:order.deliveryLocation||'',
        referredBy:order.referredBy||'', orderFrom:order.orderType==='FARAL'?'Web App':'Web App (Split)',
        orderType:order.orderType, qty:ci.qty, itemName:ci.en, deliveryWeight:ci.weight,
        totalWt:ci.weight*ci.qty, amount:order.orderType==='FARAL' ? Math.round(ci.unitPrice*ci.qty) : (i===0?Math.round(total):0),
        orderStatus:'CONFIRMED', paymentStatus:'PENDING'
      }));
      const resp = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action:'add_order', rows})});
      if(resp.ok){ order.synced=true; CFG.set('tos_orders',orders); document.getElementById(sid).className='sync-msg ok'; document.getElementById(sid).textContent='📊 ✅ Google Sheet मध्ये सेव्ह झाले!'; }
    } catch(err) { document.getElementById(sid).className='sync-msg fail'; document.getElementById(sid).textContent='📊 ⚠️ Sheet sync failed. Saved locally.'; }
  }
}

fetchLiveRates();
</script>
</body>
</html>
